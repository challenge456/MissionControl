# Feature Development Workflow
# 7-agent workflow: plan → setup → implement → verify → test → PR handoff → review recommendation
# 
# Inspired by Antfarm's proven feature-dev pattern.
# Pull-request creation remains a deterministic control-plane action.
#
# AGENT CONTRACT:
#   Inputs:  {{goal}} - The feature request string
#   Outputs: Structured implementation and review handoff
#   Steps:   7 sequential steps with verification gates
#
# STEP REFERENCE:
#   1. planner:    Create implementation plan → outputs plan.md
#   2. setup:      Prepare workspace, clone repo → outputs ready signal
#   3. developer:  Implement feature → outputs code changes
#   4. verifier:   Verify implementation matches plan → outputs verification report
#   5. tester:     Run tests → outputs test results
#   6. pr-creator: Prepare PR handoff → outputs structured evidence
#   7. reviewer:   Final review → outputs a recommendation, never merge authority
#
# ERROR HANDLING:
#   - Step failure triggers retry (max 3)
#   - After max retries, escalates to human
#
# APPROVAL:
#   - Auto-approve: LOW risk
#   - Human required: HIGH risk

id: feature-dev
name: Feature Development
description: "Deterministic feature development workflow with verification gates"

agents:
  - id: planner
    persona: Strategist
    workspace:
      files:
        AGENTS.md: agents/strategist/AGENTS.md
  
  - id: setup
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md
  
  - id: developer
    persona: Coder
    workspace:
      files:
        AGENTS.md: agents/coder/AGENTS.md
  
  - id: verifier
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: tester
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: pr-creator
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md
  
  - id: reviewer
    persona: Coordinator
    workspace:
      files:
        AGENTS.md: agents/coordinator/AGENTS.md

steps:
  - id: plan
    agent: planner
    input: |
      Break down this feature request into implementation stories:
      {{task}}
      
      Return JSON with status: "COMPLETED", a stories array, and a compact handoff.
      
      Include:
      - User stories (3-7 stories)
      - Acceptance criteria per story
      - Dependencies between stories
      - Estimated effort per story
      
      Format each story clearly with:
      Story N: [title]
      - Acceptance: [criteria]
      - Depends on: [story numbers or "none"]
    expects: "stories"
    outputSchema:
      type: object
      required: [status, stories]
      properties:
        status: { type: string }
        stories: { type: array }
    retryLimit: 2
    timeoutMinutes: 10
    isolation: READ_ONLY

  - id: setup
    agent: setup
    input: |
      Set up the development environment for:
      {{planOutput}}
      
      Return JSON with status: "COMPLETED", setupSummary, and a compact handoff.
      
      Tasks:
      - Inspect the allocated worktree and server-owned branch
      - Install any new dependencies needed
      - Verify build passes
      - Prepare test environment
      Do not create or push branches; the control plane owns repository publication.
    expects: "setupSummary"
    outputSchema:
      type: object
      required: [status, setupSummary]
      properties:
        status: { type: string }
        setupSummary: { type: string }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE

  - id: implement
    agent: developer
    input: |
      Implement the following stories:
      {{planOutput}}
      
      Environment: {{setupOutput}}
      
      Return JSON with status: "COMPLETED", implementationSummary, changedFiles,
      and a compact handoff.
      
      For each story:
      - Write implementation following .cursorrules conventions
      - Add inline tests for core logic
      - Use TypeScript strict mode (no any types)
      - Follow existing patterns in the codebase
      - Leave changes reviewable; the control plane owns commit and publication
      
      IMPORTANT:
      - Read relevant existing code before making changes
      - Use Convex for backend (no Express)
      - Follow Mission Control's architecture patterns
    expects: "implementationSummary"
    outputSchema:
      type: object
      required: [status, implementationSummary, changedFiles]
      properties:
        status: { type: string }
        implementationSummary: { type: string }
        changedFiles: { type: array }
    retryLimit: 3
    timeoutMinutes: 45
    isolation: WORKTREE

  - id: verify
    agent: verifier
    input: |
      Verify the implementation against acceptance criteria.
      
      Stories: {{planOutput}}
      Implementation: {{implementOutput}}
      
      Return JSON with status: "COMPLETED", verifiedCriteria, issues, and a compact handoff.
      
      Check each story:
      - All acceptance criteria met
      - Code follows project conventions
      - No obvious bugs or edge cases missed
      - TypeScript types are correct
      - Error handling is present
      
      If issues found, list them clearly.
      If all criteria met, state "All acceptance criteria verified."
    expects: "verifiedCriteria"
    outputSchema:
      type: object
      required: [status, verifiedCriteria, issues]
      properties:
        status: { type: string }
        verifiedCriteria: { type: array }
        issues: { type: array }
    retryLimit: 2
    timeoutMinutes: 15
    isolation: READ_ONLY

  - id: test
    agent: tester
    input: |
      Run comprehensive tests on the implementation.
      
      Implementation: {{implementOutput}}
      Verification: {{verifyOutput}}
      
      Return JSON with status: "COMPLETED", passed, commands, failures, and a compact handoff.
      
      Run:
      - Unit tests (npm test or pnpm test)
      - Type checking (tsc --noEmit)
      - Linter (if configured)
      - Manual smoke tests in dev environment
      
      Report:
      - All tests passing: yes/no
      - Coverage: [percentage if available]
      - Issues found: [list or "none"]
    expects: "passed"
    outputSchema:
      type: object
      required: [status, passed, commands, failures]
      properties:
        status: { type: string }
        passed: { type: boolean }
        commands: { type: array }
        failures: { type: array }
    retryLimit: 2
    timeoutMinutes: 20
    isolation: WORKTREE

  - id: pr
    agent: pr-creator
    input: |
      Prepare the pull-request evidence handoff for the completed feature.
      
      Implementation: {{implementOutput}}
      Verification: {{verifyOutput}}
      Tests: {{testOutput}}
      
      Return JSON with status: "COMPLETED", title, body, evidenceReferences,
      and a compact handoff for the control plane.
      
      PR should include:
      - Clear title and description
      - Link to original task/issue
      - Summary of changes
      - Test results
      - Screenshots (if UI changes)
      
      Do not push, create, update, approve, or merge a pull request.
    expects: "evidenceReferences"
    outputSchema:
      type: object
      required: [status, title, body, evidenceReferences]
      properties:
        status: { type: string }
        title: { type: string }
        body: { type: string }
        evidenceReferences: { type: array }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE

  - id: review
    agent: reviewer
    input: |
      Review the completed work and return a non-authoritative recommendation.
      
      PR: {{prOutput}}
      Stories: {{planOutput}}
      Verification: {{verifyOutput}}
      Tests: {{testOutput}}
      
      Return JSON with status: "COMPLETED", recommendation, findings, and a compact handoff.
      
      Final checks:
      - All stories completed
      - Tests passing
      - Code quality acceptable
      - Ready for human review
      
      If changes needed, list them clearly.
      Do not approve or merge; human governance owns that decision.
    expects: "recommendation"
    outputSchema:
      type: object
      required: [status, recommendation, findings]
      properties:
        status: { type: string }
        recommendation: { type: string }
        findings: { type: array }
    retryLimit: 1
    timeoutMinutes: 10
    isolation: READ_ONLY
    failurePolicy: BLOCK
