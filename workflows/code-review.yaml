# Code Review Workflow
# 4-agent workflow: intake → review → verify-suggestions → review recommendation
#
# Purpose: Thorough code review with security, style, and logic verification
#
# AGENT CONTRACT:
#   Inputs:  {{pr_url}} or {{diff}} - Code to review
#   Outputs: Structured non-authoritative review recommendation with comments
#   Steps:   4 sequential steps
#
# STEP REFERENCE:
#   1. intake:    Parse PR/diff → outputs structured review request
#   2. reviewer:  Analyze code → outputs review comments
#   3. verifier:  Check suggestions → outputs verification report
#   4. approver:  Final synthesis → outputs a human-review recommendation
#
# ERROR HANDLING:
#   - Step failure triggers retry (max 3)
#   - After max retries, assigns to human reviewer

id: code-review
name: Code Review
description: "Thorough code review with security, style, and logic verification"

agents:
  - id: intake
    persona: Coordinator
    workspace:
      files:
        AGENTS.md: agents/coordinator/AGENTS.md
  
  - id: reviewer
    persona: Coder
    workspace:
      files:
        AGENTS.md: agents/coder/AGENTS.md
        CODING_STANDARDS.md: CODING_STANDARDS.md
  
  - id: verifier
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: approver
    persona: Lead
    workspace:
      files:
        AGENTS.md: agents/lead/AGENTS.md

steps:
  - id: intake
    agent: intake
    input: |
      Review this pull request/code change:
      {{prDescription}}
      
      Code to review:
      {{diff}}
      
      Return JSON with status: "COMPLETED", summary, changedFiles, redFlags,
      and a compact handoff.
      
      Tasks:
      - Summarize what the code change does
      - Identify files changed and scope
      - Note any obvious red flags
      - Check if PR description matches the actual changes
    expects: "summary"
    outputSchema:
      type: object
      required: [status, summary, changedFiles, redFlags]
      properties:
        status: { type: string }
        summary: { type: string }
        changedFiles: { type: array }
        redFlags: { type: array }
    retryLimit: 1
    timeoutMinutes: 5

  - id: review
    agent: reviewer
    input: |
      Perform a thorough code review of:
      {{intakeOutput}}
      
      Code:
      {{diff}}
      
      Return JSON with status: "COMPLETED", findings, strengths,
      architecturalConcerns, and a compact handoff.
      
      Check for:
      1. Security issues (injection, auth, secrets)
      2. Logic errors (edge cases, null handling, race conditions)
      3. Style violations (naming, formatting, consistency)
      4. Performance issues (N+1 queries, inefficient loops)
      5. Test coverage (are tests present? do they cover edge cases?)
      6. Documentation (comments, README updates)
      
      For each issue found:
      - File:line: specific location
      - Severity: CRITICAL / HIGH / MEDIUM / LOW
      - Issue: clear description
      - Suggestion: how to fix
      
      Also note:
      - What this code does well
      - Any architectural concerns
    expects: "findings"
    outputSchema:
      type: object
      required: [status, findings, strengths, architecturalConcerns]
      properties:
        status: { type: string }
        findings: { type: array }
        strengths: { type: array }
        architecturalConcerns: { type: array }
    retryLimit: 2
    timeoutMinutes: 15

  - id: verify
    agent: verifier
    input: |
      Verify the review suggestions for this code:
      {{reviewOutput}}
      
      Code:
      {{diff}}
      
      Return JSON with status: "COMPLETED", validFindings, rejectedFindings,
      assessment, and a compact handoff.
      
      Tasks:
      - Check that each suggestion is actionable and specific
      - Verify suggestions don't conflict with each other
      - Ensure no false positives in the review
      - Validate that CRITICAL/HIGH issues are real problems
      - Confirm test coverage feedback is accurate
      
      Output:
      - Valid suggestions (list by severity)
      - Any suggestions to disregard (with reason)
      - Overall assessment: thorough/superficial/missed issues
    expects: "validFindings"
    outputSchema:
      type: object
      required: [status, validFindings, rejectedFindings, assessment]
      properties:
        status: { type: string }
        validFindings: { type: array }
        rejectedFindings: { type: array }
        assessment: { type: string }
    retryLimit: 1
    timeoutMinutes: 10

  - id: approve
    agent: approver
    input: |
      Produce a final non-authoritative review recommendation based on:
      {{verifyOutput}}
      
      Original code:
      {{diff}}
      
      Return JSON with status: "COMPLETED", recommendation, findings,
      requiredChanges, optionalImprovements, securityVerdict, and a compact handoff.
      
      Recommendation options:
      - READY_FOR_HUMAN_REVIEW: Evidence supports review readiness
      - READY_WITH_NITS: Minor suggestions remain
      - CHANGES_REQUIRED: Issues must be addressed
      
      Include:
      - Recommendation
      - Summary of findings
      - Required changes (if any)
      - Optional improvements (if any)
      - Security verdict (CLEAR / NEEDS_FIX)
      
      If CHANGES_REQUIRED:
      - List must-fix issues by severity
      - Suggest re-review after fixes
      This step cannot submit a provider review, approve, or merge. Human governance owns the decision.
    expects: "recommendation"
    outputSchema:
      type: object
      required: [status, recommendation, findings, requiredChanges, optionalImprovements, securityVerdict]
      properties:
        status: { type: string }
        recommendation: { type: string }
        findings: { type: array }
        requiredChanges: { type: array }
        optionalImprovements: { type: array }
        securityVerdict: { type: string }
    retryLimit: 1
    timeoutMinutes: 5

onSuccess:
  action: notify
  message: "Code review complete: {{decision}}"
  
onFailure:
  action: escalate
  message: "Code review workflow failed, requires manual review"
