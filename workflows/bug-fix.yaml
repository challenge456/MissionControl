# Bug Fix Workflow
# 6-agent workflow: triage → investigate → setup → fix → verify → PR handoff
# 
# Inspired by Antfarm's proven bug-fix pattern.
# Paste a bug report, get back a fix with regression test.
#
# AGENT CONTRACT:
#   Inputs:  {{bug_report}} - Bug description with reproduction steps
#   Outputs: Structured fix, verification, and pull-request handoff
#   Steps:   6 sequential steps with root cause analysis
#
# STEP REFERENCE:
#   1. triager:      Classify bug severity → outputs triage report
#   2. investigator: Find root cause → outputs analysis.md
#   3. setup:        Prepare workspace → outputs ready signal
#   4. fixer:        Implement fix → outputs code changes
#   5. tester:       Add regression test → outputs test results
#   6. pr-creator:   Prepare PR handoff → outputs evidence packet
#
# ERROR HANDLING:
#   - Step failure triggers retry (max 3)
#   - After max retries, escalates to human

id: bug-fix
name: Bug Fix
description: "Deterministic bug fix workflow with root cause analysis"

agents:
  - id: triager
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: investigator
    persona: Coder
    workspace:
      files:
        AGENTS.md: agents/coder/AGENTS.md
  
  - id: setup
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md
  
  - id: fixer
    persona: Coder
    workspace:
      files:
        AGENTS.md: agents/coder/AGENTS.md
  
  - id: verifier
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: pr-creator
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md

steps:
  - id: triage
    agent: triager
    input: |
      Reproduce this bug:
      {{task}}
      
      Return JSON with status: "COMPLETED", reproduced, severity, observations,
      and a compact handoff.
      
      Document:
      - Steps to reproduce
      - Expected behavior
      - Actual behavior
      - Severity: critical/high/medium/low
      - Environment details (if relevant)
      - Screenshots/logs (if available)
      
      If you cannot reproduce, state "TRIAGE: Cannot reproduce"
    expects: "observations"
    outputSchema:
      type: object
      required: [status, reproduced, severity, observations]
      properties:
        status: { type: string }
        reproduced: { type: boolean }
        severity: { type: string }
        observations: { type: array }
    retryLimit: 2
    timeoutMinutes: 15
    isolation: READ_ONLY

  - id: investigate
    agent: investigator
    input: |
      Find the root cause of this bug:
      {{triageOutput}}
      
      Return JSON with status: "COMPLETED", rootCause, affectedPaths,
      recommendedFix, and a compact handoff.
      
      Investigate:
      - Read affected code paths
      - Trace execution flow
      - Identify root cause
      - Propose fix approach
      
      Provide:
      - Root cause explanation
      - Affected files/functions
      - Recommended fix strategy
    expects: "rootCause"
    outputSchema:
      type: object
      required: [status, rootCause, affectedPaths, recommendedFix]
      properties:
        status: { type: string }
        rootCause: { type: string }
        affectedPaths: { type: array }
        recommendedFix: { type: string }
    retryLimit: 2
    timeoutMinutes: 20
    isolation: READ_ONLY

  - id: setup
    agent: setup
    input: |
      Set up environment for bug fix:
      {{investigateOutput}}
      
      Return JSON with status: "COMPLETED", setupSummary, and a compact handoff.
      
      Tasks:
      - Inspect the allocated worktree and server-owned branch
      - Prepare test environment
      - Verify bug reproduces in dev
      Do not create or push branches.
    expects: "setupSummary"
    outputSchema:
      type: object
      required: [status, setupSummary]
      properties:
        status: { type: string }
        setupSummary: { type: string }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE

  - id: fix
    agent: fixer
    input: |
      Implement the bug fix:
      
      Root cause: {{investigateOutput}}
      Environment: {{setupOutput}}
      
      Return JSON with status: "COMPLETED", fixSummary, changedFiles,
      regressionTests, and a compact handoff.
      
      Implementation:
      - Apply the fix following the proposed approach
      - Add regression test to prevent recurrence
      - Include manual verification steps
      - Update relevant documentation
      - Leave changes reviewable; the control plane owns commit and publication
      
      IMPORTANT:
      - Fix the root cause, not just the symptom
      - Ensure fix doesn't introduce new issues
      - Follow project conventions
    expects: "fixSummary"
    outputSchema:
      type: object
      required: [status, fixSummary, changedFiles, regressionTests]
      properties:
        status: { type: string }
        fixSummary: { type: string }
        changedFiles: { type: array }
        regressionTests: { type: array }
    retryLimit: 3
    timeoutMinutes: 30
    isolation: WORKTREE

  - id: verify
    agent: verifier
    input: |
      Verify the bug fix:
      
      Original bug: {{triageOutput}}
      Fix: {{fixOutput}}
      
      Return JSON with status: "COMPLETED", passed, commands, failures,
      and a compact handoff.
      
      Confirm:
      - Original bug no longer reproduces
      - Regression test passes
      - No new issues introduced
      - Manual verification steps completed
      
      Test thoroughly with edge cases.
      If issues found, list them clearly.
    expects: "passed"
    outputSchema:
      type: object
      required: [status, passed, commands, failures]
      properties:
        status: { type: string }
        passed: { type: boolean }
        commands: { type: array }
        failures: { type: array }
    retryLimit: 2
    timeoutMinutes: 15
    isolation: READ_ONLY

  - id: pr
    agent: pr-creator
    input: |
      Prepare the pull-request handoff for the bug fix:
      
      Fix: {{fixOutput}}
      Verification: {{verifyOutput}}
      
      Return JSON with status: "COMPLETED", title, body, evidenceReferences,
      and a compact handoff for the control plane.
      
      PR should include:
      - Title: "Fix: [bug description]"
      - Link to original bug report
      - Root cause explanation
      - Fix description
      - Test results
      - Closes #[issue-number] (if applicable)
      
      Do not push, create, update, approve, or merge a pull request.
    expects: "evidenceReferences"
    outputSchema:
      type: object
      required: [status, title, body, evidenceReferences]
      properties:
        status: { type: string }
        title: { type: string }
        body: { type: string }
        evidenceReferences: { type: array }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE
