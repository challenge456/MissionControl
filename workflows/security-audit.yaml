# Security Audit Workflow
# 7-agent workflow: scan → prioritize → setup → fix → verify → test → PR handoff
# 
# Inspired by Antfarm's proven security-audit pattern.
# Point it at a repo, get back a security fix PR with regression tests.
#
# AGENT CONTRACT:
#   Inputs:  {{repo_url}} or {{workspace}} - Repository to audit
#   Outputs: Structured security evidence and pull-request handoff
#   Steps:   7 sequential steps with severity prioritization
#
# STEP REFERENCE:
#   1. scanner:      Run security scan → outputs findings report
#   2. prioritizer:  Rank by severity → outputs prioritized list
#   3. setup:        Prepare workspace → outputs ready signal
#   4. fixer:        Implement fixes → outputs code changes
#   5. verifier:     Verify fixes → outputs verification report
#   6. tester:       Add regression tests → outputs test results
#   7. pr-creator:   Prepare PR handoff → outputs evidence packet
#
# ERROR HANDLING:
#   - Step failure triggers retry (max 3)
#   - After max retries, escalates to security team
#
# APPROVAL:
#   - HIGH risk fixes require security team approval

id: security-audit
name: Security Audit
description: "Comprehensive security scan and fix workflow"

agents:
  - id: scanner
    persona: Compliance
    workspace:
      files:
        AGENTS.md: agents/compliance/AGENTS.md
  
  - id: prioritizer
    persona: Compliance
    workspace:
      files:
        AGENTS.md: agents/compliance/AGENTS.md
  
  - id: setup
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md
  
  - id: fixer
    persona: Coder
    workspace:
      files:
        AGENTS.md: agents/coder/AGENTS.md
  
  - id: verifier
    persona: Compliance
    workspace:
      files:
        AGENTS.md: agents/compliance/AGENTS.md
  
  - id: tester
    persona: QA
    workspace:
      files:
        AGENTS.md: agents/qa/AGENTS.md
  
  - id: pr-creator
    persona: Operations
    workspace:
      files:
        AGENTS.md: agents/operations/AGENTS.md

steps:
  - id: scan
    agent: scanner
    input: |
      Scan the codebase for security vulnerabilities:
      {{task}}
      
      Return JSON with status: "COMPLETED", vulnerabilities, commands,
      limitations, and a compact handoff.
      
      Check for:
      - Dependency vulnerabilities (npm audit, pnpm audit)
      - Code injection risks (SQL injection, XSS, command injection)
      - Authentication/authorization issues
      - Data exposure risks (secrets in code, logs)
      - Insecure configurations
      - Known CVEs in dependencies
      
      For each vulnerability found:
      - Type and description
      - Location (file:line or package)
      - Severity assessment
    expects: "vulnerabilities"
    outputSchema:
      type: object
      required: [status, vulnerabilities, commands, limitations]
      properties:
        status: { type: string }
        vulnerabilities: { type: array }
        commands: { type: array }
        limitations: { type: array }
    retryLimit: 1
    timeoutMinutes: 20
    isolation: READ_ONLY

  - id: prioritize
    agent: prioritizer
    input: |
      Rank vulnerabilities by severity and fix priority:
      {{scanOutput}}
      
      Return JSON with status: "COMPLETED", priorityList, rationale,
      and a compact handoff.
      
      For each vulnerability:
      - Severity: critical/high/medium/low
      - Exploitability: easy/moderate/difficult
      - Impact: high/medium/low
      - Recommended fix order
      
      Prioritize:
      1. Critical + easily exploitable first
      2. High severity next
      3. Medium/low based on impact
      
      List top 5-10 vulnerabilities to fix in this run.
    expects: "priorityList"
    outputSchema:
      type: object
      required: [status, priorityList, rationale]
      properties:
        status: { type: string }
        priorityList: { type: array }
        rationale: { type: string }
    retryLimit: 1
    timeoutMinutes: 10
    isolation: READ_ONLY

  - id: setup
    agent: setup
    input: |
      Set up environment for security fixes:
      {{prioritizeOutput}}
      
      Return JSON with status: "COMPLETED", setupSummary, and a compact handoff.
      
      Tasks:
      - Inspect the allocated worktree and server-owned branch
      - Prepare test environment
      - Confirm the base revision
      Do not create or push branches.
    expects: "setupSummary"
    outputSchema:
      type: object
      required: [status, setupSummary]
      properties:
        status: { type: string }
        setupSummary: { type: string }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE

  - id: fix
    agent: fixer
    input: |
      Fix the highest priority vulnerabilities:
      {{prioritizeOutput}}
      
      Environment: {{setupOutput}}
      
      Return JSON with status: "COMPLETED", fixes, changedFiles,
      regressionTests, and a compact handoff.
      
      For each vulnerability:
      - Apply security patch
      - Add regression test
      - Document the change
      - Verify fix doesn't break functionality
      
      IMPORTANT:
      - Fix root cause, not just symptoms
      - Follow security best practices
      - Test thoroughly
      - Leave changes reviewable; the control plane owns commit and publication
    expects: "fixes"
    outputSchema:
      type: object
      required: [status, fixes, changedFiles, regressionTests]
      properties:
        status: { type: string }
        fixes: { type: array }
        changedFiles: { type: array }
        regressionTests: { type: array }
    retryLimit: 2
    timeoutMinutes: 45
    isolation: WORKTREE

  - id: verify
    agent: verifier
    input: |
      Re-scan to verify all fixes are effective:
      
      Original scan: {{scanOutput}}
      Fixes applied: {{fixOutput}}
      
      Return JSON with status: "COMPLETED", resolvedVulnerabilities,
      remainingVulnerabilities, commands, and a compact handoff.
      
      Confirm:
      - All targeted vulnerabilities resolved
      - No new vulnerabilities introduced
      - Security best practices followed
      - No functionality broken
      
      Run security scans again:
      - npm audit / pnpm audit
      - Code analysis tools
      - Manual review of changes
    expects: "resolvedVulnerabilities"
    outputSchema:
      type: object
      required: [status, resolvedVulnerabilities, remainingVulnerabilities, commands]
      properties:
        status: { type: string }
        resolvedVulnerabilities: { type: array }
        remainingVulnerabilities: { type: array }
        commands: { type: array }
    retryLimit: 1
    timeoutMinutes: 15
    isolation: READ_ONLY

  - id: test
    agent: tester
    input: |
      Run regression tests on security fixes:
      {{fixOutput}}
      
      Return JSON with status: "COMPLETED", passed, commands, failures,
      and a compact handoff.
      
      Verify:
      - All existing tests still pass
      - New regression tests pass
      - No functionality broken
      - Performance not degraded
      
      Run full test suite and report results.
    expects: "passed"
    outputSchema:
      type: object
      required: [status, passed, commands, failures]
      properties:
        status: { type: string }
        passed: { type: boolean }
        commands: { type: array }
        failures: { type: array }
    retryLimit: 2
    timeoutMinutes: 20
    isolation: WORKTREE

  - id: pr
    agent: pr-creator
    input: |
      Prepare the pull-request handoff for the security fixes:
      
      Fixes: {{fixOutput}}
      Verification: {{verifyOutput}}
      Tests: {{testOutput}}
      
      Return JSON with status: "COMPLETED", title, body, evidenceReferences,
      and a compact handoff for the control plane.
      
      PR should include:
      - Title: "Security: Fix [N] vulnerabilities"
      - List of vulnerabilities fixed
      - Severity levels
      - Test results
      - Security scan results (before/after)
      
      Mark as security-related for priority review.
      
      Do not push, create, update, approve, or merge a pull request.
    expects: "evidenceReferences"
    outputSchema:
      type: object
      required: [status, title, body, evidenceReferences]
      properties:
        status: { type: string }
        title: { type: string }
        body: { type: string }
        evidenceReferences: { type: array }
    retryLimit: 2
    timeoutMinutes: 5
    isolation: WORKTREE
